<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XyzTech - Whot! Cyber Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090c15;
            --surface: #121829;
            --surface-card: #1e2640;
            --primary: #00f0ff;
            --accent: #ff007f;
            --success: #00ff66;
            --warning: #ffb703;
            --text-main: #f0f4f8;
            --text-muted: #8a9bb8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; user-select: none; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
        }
        header {
            width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: var(--surface); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 12px;
        }
        .brand { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--primary); }
        .status-badge { font-size: 0.95rem; color: var(--warning); font-weight: 700; background: rgba(255, 183, 3, 0.1); padding: 4px 12px; border-radius: 20px; border: 1px solid var(--warning); }
        .game-arena { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; align-items: center; margin: 10px 0; }
        .bot-area, .player-area { width: 100%; background: var(--surface); padding: 15px; border-radius: 12px; border: 1px solid rgba(0, 240, 255, 0.2); display: flex; flex-direction: column; gap: 8px; }
        .card-back { width: 45px; height: 65px; background: #2a0845; border: 1px solid var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #fff; }
        .field { display: flex; gap: 40px; align-items: center; justify-content: center; width: 100%; padding: 10px 0; }
        .deck-btn { width: 80px; height: 115px; background: #203a43; border: 2px solid var(--primary); border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--primary); font-family: 'Orbitron', sans-serif; }
        .card { width: 80px; height: 115px; background: var(--surface-card); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 10px; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; cursor: pointer; position: relative; }
        .card.playable { border-color: var(--success); box-shadow: 0 0 10px rgba(0, 255, 102, 0.4); }
        .card-corner { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; }
        .card-center { font-size: 1.8rem; text-align: center; }
        .suit-circle { color: #00f0ff; } .suit-triangle { color: #ff007f; } .suit-cross { color: #ffb703; } .suit-square { color: #00ff66; } .suit-star { color: #a064ff; } .suit-whot { color: #ffffff; }
        .log-box { width: 100%; max-width: 800px; background: rgba(18, 24, 41, 0.8); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; color: var(--text-muted); text-align: center; }
        .player-hand { display: flex; gap: 10px; overflow-x: auto; padding: 5px; }
        .modal, .game-over-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 9, 19, 0.9); display: none; align-items: center; justify-content: center; z-index: 100; flex-direction: column; }
        .modal-content { background: var(--surface); border: 2px solid var(--primary); border-radius: 16px; padding: 25px; text-align: center; width: 90%; max-width: 350px; }
        .suit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .suit-select-btn { background: var(--surface-card); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; color: #fff; cursor: pointer; font-size: 1rem; }
        .restart-btn { margin-top: 15px; background: var(--primary); color: #000; font-family: 'Orbitron', sans-serif; font-weight: 800; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="brand">XYZTECH // WHOT</div>
        <div class="status-badge" id="turn-badge">YOUR TURN</div>
    </header>

    <div class="game-arena">
        <div class="bot-area">
            <div style="font-family:'Orbitron'; color:var(--accent); font-size:0.9rem;">🤖 CYBER_BOT <span id="bot-count">(6)</span></div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;" id="bot-hand-display"></div>
        </div>

        <div class="field">
            <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
                <span style="font-size:0.8rem; color:var(--text-muted);">DECK</span>
                <div class="deck-btn" onclick="playerDrawCard()">
                    <div>🎴</div>
                    <div id="deck-count" style="font-size:0.8rem;">30</div>
                </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
                <span style="font-size:0.8rem; color:var(--text-muted);">TOP CARD</span>
                <div id="top-card-display"></div>
            </div>
        </div>

        <div class="log-box" id="log-text">Match top card by suit or number!</div>
    </div>

    <div class="player-area">
        <div style="font-family:'Orbitron'; color:var(--primary); font-size:0.9rem;">👤 YOUR HAND</div>
        <div class="player-hand" id="player-hand"></div>
    </div>

    <div class="modal" id="whot-modal">
        <div class="modal-content">
            <h3 style="font-family:'Orbitron'; color:var(--primary); margin-bottom:10px;">DECLARE SUIT</h3>
            <div class="suit-grid">
                <button class="suit-select-btn" onclick="selectWhotSuit('Circle')">⭕ Circle</button>
                <button class="suit-select-btn" onclick="selectWhotSuit('Triangle')">🔺 Triangle</button>
                <button class="suit-select-btn" onclick="selectWhotSuit('Cross')">✖️ Cross</button>
                <button class="suit-select-btn" onclick="selectWhotSuit('Square')">⬛ Square</button>
                <button class="suit-select-btn" onclick="selectWhotSuit('Star')">⭐️ Star</button>
            </div>
        </div>
    </div>

    <div class="game-over-modal" id="game-over-modal">
        <h2 id="game-over-title" style="font-family:'Orbitron'; font-size:2rem; margin-bottom:10px;">VICTORY</h2>
        <p id="game-over-msg" style="color:var(--text-muted);">Game Over</p>
        <button class="restart-btn" onclick="initGame()">PLAY AGAIN</button>
    </div>

    <script>
        const SUITS = {
            Circle: { symbol: '⭕', css: 'suit-circle' },
            Triangle: { symbol: '🔺', css: 'suit-triangle' },
            Cross: { symbol: '✖️', css: 'suit-cross' },
            Square: { symbol: '⬛', css: 'suit-square' },
            Star: { symbol: '⭐️', css: 'suit-star' },
            Whot: { symbol: '🃏', css: 'suit-whot' }
        };

        let deck = [], discardPile = [], playerHand = [], botHand = [], topCard = null;
        let isPlayerTurn = true, activeSuit = null, pendingWhotIndex = null;

        function createDeck() {
            let d = [];
            const configs = { Circle: [1,2,3,4,5,7,8,10,11,12,13,14], Triangle: [1,2,3,4,5,7,8,10,11,12,13,14], Cross: [1,2,3,5,7,10,11,13,14], Square: [1,2,3,5,7,10,11,13,14], Star: [1,2,3,4,5,7,8] };
            for (let s in configs) configs[s].forEach(n => d.push({ suit: s, number: n }));
            for (let i = 0; i < 4; i++) d.push({ suit: 'Whot', number: 20 });
            return d.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            deck = createDeck(); discardPile = []; playerHand = []; botHand = []; activeSuit = null; isPlayerTurn = true;
            document.getElementById('game-over-modal').style.display = 'none';
            for (let i = 0; i < 6; i++) { playerHand.push(deck.pop()); botHand.push(deck.pop()); }
            do { topCard = deck.pop(); } while (topCard.suit === 'Whot');
            updateUI();
            log("Game started!");
        }

        function updateUI() {
            document.getElementById('deck-count').innerText = deck.length;
            document.getElementById('bot-count').innerText = `(${botHand.length})`;
            document.getElementById('turn-badge').innerText = isPlayerTurn ? "YOUR TURN" : "BOT'S TURN";

            let topD = document.getElementById('top-card-display');
            let info = SUITS[topCard.suit];
            topD.innerHTML = `<div class="card"><div class="card-corner ${info.css}">${topCard.number}</div><div class="card-center ${info.css}">${info.symbol}</div><div class="card-corner ${info.css}" style="text-align:right;">${topCard.number}</div></div>`;
            if (activeSuit) topD.innerHTML += `<div style="font-size:0.75rem; color:var(--primary); text-align:center; margin-top:3px;">Call: ${activeSuit}</div>`;

            let botD = document.getElementById('bot-hand-display');
            botD.innerHTML = '';
            for (let i = 0; i < botHand.length; i++) botD.innerHTML += `<div class="card-back">W</div>`;

            let playerD = document.getElementById('player-hand');
            playerD.innerHTML = '';
            playerHand.forEach((c, idx) => {
                let playable = c.suit === 'Whot' || (activeSuit ? c.suit === activeSuit : (c.suit === topCard.suit || c.number === topCard.number));
                let sInfo = SUITS[c.suit];
                let cardEl = document.createElement('div');
                cardEl.className = `card ${playable ? 'playable' : ''}`;
                cardEl.innerHTML = `<div class="card-corner ${sInfo.css}">${c.number}</div><div class="card-center ${sInfo.css}">${sInfo.symbol}</div><div class="card-corner ${sInfo.css}" style="text-align:right;">${c.number}</div>`;
                cardEl.onclick = () => playCard(idx);
                playerD.appendChild(cardEl);
            });
        }

        function log(msg) { document.getElementById('log-text').innerText = msg; }

        function playCard(idx) {
            if (!isPlayerTurn) return;
            let c = playerHand[idx];
            let playable = c.suit === 'Whot' || (activeSuit ? c.suit === activeSuit : (c.suit === topCard.suit || c.number === topCard.number));
            if (!playable) { log("Invalid card!"); return; }

            if (c.suit === 'Whot') {
                pendingWhotIndex = idx;
                document.getElementById('whot-modal').style.display = 'flex';
                return;
            }
            executeMove(idx, playerHand, "Player");
        }

        function selectWhotSuit(s) {
            document.getElementById('whot-modal').style.display = 'none';
            activeSuit = s;
            executeMove(pendingWhotIndex, playerHand, "Player", true);
        }

        function executeMove(idx, hand, agent, isWhot = false) {
            let c = hand.splice(idx, 1)[0];
            discardPile.push(topCard);
            topCard = c;
            if (!isWhot) activeSuit = null;
            log(`${agent} played ${c.suit} ${c.number}`);
            updateUI();

            if (playerHand.length === 0) return gameOver(true);
            if (botHand.length === 0) return gameOver(false);

            isPlayerTurn = !isPlayerTurn;
            updateUI();
            if (!isPlayerTurn) setTimeout(botTurn, 1000);
        }

        function playerDrawCard() {
            if (!isPlayerTurn) return;
            if (deck.length === 0) refillDeck();
            if (deck.length > 0) {
                playerHand.push(deck.pop());
                log("You drew a card.");
                isPlayerTurn = false;
                updateUI();
                setTimeout(botTurn, 1000);
            }
        }

        function botTurn() {
            if (isPlayerTurn) return;
            let validIdx = botHand.findIndex(c => c.suit === 'Whot' || (activeSuit ? c.suit === activeSuit : (c.suit === topCard.suit || c.number === topCard.number)));
            
            if (validIdx !== -1) {
                let c = botHand[validIdx];
                if (c.suit === 'Whot') {
                    activeSuit = 'Circle';
                    executeMove(validIdx, botHand, "Bot", true);
                } else {
                    executeMove(validIdx, botHand, "Bot");
                }
            } else {
                if (deck.length === 0) refillDeck();
                if (deck.length > 0) botHand.push(deck.pop());
                log("Bot drew a card.");
                isPlayerTurn = true;
                updateUI();
            }
        }

        function refillDeck() {
            if (discardPile.length > 0) {
                deck = discardPile.sort(() => Math.random() - 0.5);
                discardPile = [];
                log("Reshuffled deck!");
            } else {
                deck = [{ suit: 'Circle', number: 1 }, { suit: 'Triangle', number: 2 }, { suit: 'Whot', number: 20 }];
            }
        }

        function gameOver(won) {
            let m = document.getElementById('game-over-modal');
            let t = document.getElementById('game-over-title');
            t.innerText = won ? "VICTORY!" : "DEFEAT";
            t.className = won ? "win" : "lose";
            m.style.display = 'flex';
        }

        window.onload = initGame;
    </script>
</body>
</html>
