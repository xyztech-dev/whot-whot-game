<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XyzTech - Cyber Arcade Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #12141a;
            --surface: #1c202b;
            --surface-card: #252a38;
            --primary: #00f0ff;
            --accent: #ff007f;
            --warning: #ffb703;
            --success: #00ff66;
            --text-main: #f0f4f8;
            --text-muted: #8a9bb8;
            
            --whot-red: #9e1b2f;
            --card-bg: #fdfdfd;

            --ludo-red: #ff3366;
            --ludo-green: #00cc66;
            --ludo-yellow: #ffcc00;
            --ludo-blue: #3399ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; user-select: none; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
        }

        header {
            width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: var(--surface); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 12px;
        }
        .brand { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--primary); }
        .header-controls { display: flex; gap: 8px; align-items: center; }
        .status-badge { font-size: 0.85rem; color: var(--warning); font-weight: 700; background: rgba(255, 183, 3, 0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--warning); }
        .nav-btn { background: none; border: 1px solid var(--primary); color: var(--primary); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; }

        /* LOBBY */
        #game-lobby {
            width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center;
            gap: 20px; padding: 30px 15px; margin: auto; text-align: center;
        }
        .lobby-title { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: var(--primary); font-weight: 900; }
        .lobby-subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 10px; }
        .game-cards-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; width: 100%; }
        .game-selection-card {
            background: var(--surface); border: 2px solid rgba(0, 240, 255, 0.3); border-radius: 16px;
            padding: 20px; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .game-selection-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        .game-icon { font-size: 3rem; }
        .game-card-title { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: var(--text-main); font-weight: 800; }
        .game-card-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.3; }

        /* WHOT STYLES */
        #whot-section { width: 100%; max-width: 800px; display: none; flex-direction: column; align-items: center; }
        .timer-bar-container { width: 100%; max-width: 800px; background: rgba(255,255,255,0.05); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; }
        .timer-bar { height: 100%; background: var(--primary); width: 100%; transition: width 1s linear; }
        .game-arena { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 12px; align-items: center; margin: 8px 0; }
        .bot-area, .player-area { width: 100%; background: var(--surface); padding: 12px; border-radius: 12px; border: 1px solid rgba(0, 240, 255, 0.2); display: flex; flex-direction: column; gap: 8px; }
        
        .card {
            width: 80px; height: 120px; background: var(--card-bg); border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column;
            justify-content: space-between; padding: 6px; cursor: pointer; position: relative;
            color: var(--whot-red); border: 1px solid #dcdcdc; flex-shrink: 0;
        }
        .card.playable { box-shadow: 0 0 12px #00ff66; border: 2px solid #00ff66; transform: translateY(-4px); }
        .card-corner { display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 800; font-size: 1.1rem; }
        .card-corner.bottom { transform: rotate(180deg); }
        .corner-symbol { font-size: 0.75rem; margin-top: 2px; }
        .card-center { display: flex; align-items: center; justify-content: center; flex-grow: 1; font-size: 2.2rem; font-weight: bold; }
        .shape-svg { fill: var(--whot-red); width: 36px; height: 36px; }
        .shape-svg-small { fill: var(--whot-red); width: 12px; height: 12px; }
        .whot-text-logo { font-family: serif; font-style: italic; font-weight: 900; font-size: 1.1rem; text-align: center; }
        .card-back { width: 50px; height: 75px; background: var(--whot-red); border: 2px solid #ffffff; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #ffffff; font-family: serif; font-style: italic; font-weight: bold; font-size: 0.75rem; }
        .field { display: flex; gap: 35px; align-items: center; justify-content: center; width: 100%; padding: 8px 0; }
        .deck-btn { width: 80px; height: 120px; background: var(--whot-red); border: 2px solid #ffffff; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; font-family: serif; font-style: italic; font-weight: bold; }
        .log-box { width: 100%; max-width: 800px; background: rgba(18, 24, 41, 0.8); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; color: var(--text-muted); text-align: center; }
        .player-hand { display: flex; gap: 8px; overflow-x: auto; padding: 8px 4px; width: 100%; }

        /* REALISTIC LUDO STYLES */
        #ludo-section { width: 100%; max-width: 480px; display: none; flex-direction: column; align-items: center; gap: 12px; }
        
        .ludo-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; background: var(--surface); padding: 10px 15px; border-radius: 12px; border: 1px solid rgba(0, 240, 255, 0.2); }
        .dice-box { width: 45px; height: 45px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: #000; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        .ludo-board {
            width: 100%;
            aspect-ratio: 1/1;
            background: #ffffff;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 4px solid var(--surface);
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        /* Bases */
        .ludo-base-red { grid-column: 1 / 7; grid-row: 1 / 7; background: var(--ludo-red); padding: 10px; display: flex; align-items: center; justify-content: center; }
        .ludo-base-green { grid-column: 10 / 16; grid-row: 1 / 7; background: var(--ludo-green); padding: 10px; display: flex; align-items: center; justify-content: center; }
        .ludo-base-yellow { grid-column: 10 / 16; grid-row: 10 / 16; background: var(--ludo-yellow); padding: 10px; display: flex; align-items: center; justify-content: center; }
        .ludo-base-blue { grid-column: 1 / 7; grid-row: 10 / 16; background: var(--ludo-blue); padding: 10px; display: flex; align-items: center; justify-content: center; }

        .base-white-box { background: #fff; width: 100%; height: 100%; border-radius: 8px; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); padding: 12px; gap: 10px; align-items: center; justify-items: center; }

        /* Track cells */
        .track
